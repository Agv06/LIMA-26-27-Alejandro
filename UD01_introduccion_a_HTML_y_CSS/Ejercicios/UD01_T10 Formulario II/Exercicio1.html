<!DOCTYPE html>
<html>
    <head>
        <title>Formulario en HTML 5</title>
        <meta name="author" content="Alejandro"/>
        <meta charset="UTF-8"/>
        <meta name="description" content="Formulario II"/>
        <meta name="keywords" content="Formulario"/>
    </head>
    <body>
        <form method="get" action="#">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required autofocus/>
            <br/>
            <br/>
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" required/>
            <br/>
            <br/>
            <label for="url">URL:</label>
            <input type="url" id="url" name="url" placeholder="Escribe a URL da túa web  persoal"/>
            <br/>
            <br/>
            <label for="data">Data:</label>
            <input type="date" id="data" name="data"/>
            <br/>
            <br/>
            <label for="hora">Hora:</label>
            <input type="datetime-local" id="hora" name="hora"/>
            <br/>
            <br/>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" min="18" max="65"/>
            <br/>
            <br/>
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono"/>
            <br/>
            <br/>
            <label for="cor">Cor favorita:</label>
            <input type="color" id="cor" name="cor"/>
            <br/>
            <br/>
            <button type="submit">Enviar</button>
        </form>
    </body>
</html>
