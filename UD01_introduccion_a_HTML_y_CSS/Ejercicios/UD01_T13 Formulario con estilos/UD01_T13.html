<!DOCTYPE html>
<html>
    <head>
        <title>Formulario con estilos</title>
        <meta name="author" content="Alejandro"/>
        <meta charset="UTF-8"/>
        <meta name="description" content="Formulario con estilos"/>
        <meta name="keywords" content="Formulario con estilos"/>
        <link href="estilos.css" rel="stylesheet"/>
    </head>
    <body>
        <form method="get" action="#">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" minlength="3" maxlength="30" pattern="[A-ZÁÉÍÓÚ]{1}[a-zA-Z/áéíóúñÁÉÍÓÚÑ \-]{2,19}" required/>
            <br/>
            <br/>
            <label for="apelidos">Apelidos:</label>
            <input type="text" id="apelidos" name="apelidos" minlength="3" maxlength="50" pattern="[A-ZÁÉÍÓÚ]{1}[a-zA-Z/áéíóúñÁÉÍÓÚÑ\s-]{2,49}" required/>
            <br/>
            <br/>
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" required/>
            <br/>
            <br/>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" min="16" max="99" required/>
            <br/>
            <br/>
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" maxlength="9"/>
            <br/>
            <br/>
            <label for="codpostal">Código postal:</label>
            <input type="text" id="codpostal" name="codpostal"  maxlength="5" required/>
            <br/>
            <br/>
            <label for="irmans">Número de irmáns:</label>
            <input type="number" min="0" max="15"/>
            <br/>
            <br/>
            <label for="url">Páxina web persoal:</label>
            <input type="url" id="url" name="url"/>
            <br/>
            <br/>
            <button type="submit">Enviar</button>
            <button type="reset">Restablecer os campos</button>
        </form>
    </body>
</html>
